# Optional bundled MinIO (S3-compatible storage). NOT loaded by default.
#
# Anonymous pulls of MinIO images now fail (quay.io returns 401; Docker Hub
# images were removed), so `docker login quay.io` first, or override
# MINIO_IMAGE with a mirror you control. Then:
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.minio.yml up -d
#
# and set STORAGE_DRIVER=s3 plus the S3_* vars (S3_ENDPOINT=http://minio:9000).
services:
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kinynx}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-in-production}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    depends_on:
      minio:
        condition: service_healthy

volumes:
  miniodata:
