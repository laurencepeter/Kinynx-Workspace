# ════════════════════════════════════════════════════════════════════════════
# Kinynx — Kubernetes manifests (self-hosted).
# Build & push images first (see README.md), then:
#   kubectl apply -f kinynx.yaml
# Replace the Secret values before applying in production.
# ════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: kinynx
---
apiVersion: v1
kind: Secret
metadata:
  name: kinynx-secrets
  namespace: kinynx
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me-in-production
  JWT_SECRET: change-me-generate-with-openssl-rand
  S3_SECRET_KEY: change-me-in-production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kinynx-config
  namespace: kinynx
data:
  NODE_ENV: production
  API_PORT: "4000"
  PUBLIC_APP_URL: https://kinynx.example.com
  POSTGRES_USER: kinynx
  POSTGRES_DB: kinynx
  REDIS_URL: redis://redis:6379
  STORAGE_DRIVER: minio
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: kinynx
  S3_ACCESS_KEY: kinynx
  S3_FORCE_PATH_STYLE: "true"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kinynx
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: kinynx-config, key: POSTGRES_USER } } }
            - { name: POSTGRES_DB, valueFrom: { configMapKeyRef: { name: kinynx-config, key: POSTGRES_DB } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: kinynx-secrets, key: POSTGRES_PASSWORD } } }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "kinynx"] }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: kinynx }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: kinynx }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: kinynx }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: kinynx }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: kinynx }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: kinynx-secrets, key: S3_SECRET_KEY } } }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: kinynx }
spec:
  selector: { app: minio }
  ports: [{ port: 9000, targetPort: 9000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: kinynx }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: kinynx/api:latest
          envFrom:
            - configMapRef: { name: kinynx-config }
          env:
            - { name: DATABASE_URL, value: postgres://kinynx:$(POSTGRES_PASSWORD)@postgres:5432/kinynx }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: kinynx-secrets, key: POSTGRES_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: kinynx-secrets, key: JWT_SECRET } } }
            - { name: S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: kinynx-secrets, key: S3_SECRET_KEY } } }
          ports: [{ containerPort: 4000 }]
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: kinynx }
spec:
  selector: { app: api }
  ports: [{ port: 4000, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: kinynx }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: worker
          image: kinynx/api:latest
          command: ["node", "dist/worker.js"]
          env:
            - { name: DATABASE_URL, value: postgres://kinynx:$(POSTGRES_PASSWORD)@postgres:5432/kinynx }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: kinynx-secrets, key: POSTGRES_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: kinynx-secrets, key: JWT_SECRET } } }
            - { name: REDIS_URL, value: redis://redis:6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: kinynx }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: kinynx/web:latest # nginx image serving apps/web (see README)
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: kinynx }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kinynx
  namespace: kinynx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # WebSocket realtime
spec:
  rules:
    - host: kinynx.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 4000 } } }
          - path: /health
            pathType: Prefix
            backend: { service: { name: api, port: { number: 4000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
