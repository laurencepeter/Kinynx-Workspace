# Static web client. Serves the multi-page app plus the deep-link routes the
# API emits in emails/links (invite, magic sign-in, password reset, published
# pages), and sets browser security headers.
# WebSocket upgrade for /api/realtime.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# Keep the original scheme from an upstream proxy (Coolify/Traefik, Caddy).
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' ws: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API passthrough, so the stack works even when a platform (e.g. Coolify)
    # routes the public domain to this container instead of Caddy. Resolved
    # lazily via Docker's embedded DNS so nginx still boots before `api` exists.
    # `^~` keeps the regex locations below from capturing /api/*.js etc.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:4000;
    client_max_body_size 200m;

    location ^~ /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
    location = /health { proxy_pass $api_upstream; }

    # Published pages → public viewer.
    location ~ ^/p/[a-z0-9-]+$ { try_files /p.html =404; }
    # Token deep links → main app (app.js reads and scrubs the token).
    location ~ ^/(invite|auth/magic|auth/reset)/[A-Za-z0-9_-]+$ { try_files /index.html =404; }
    location ~ ^/billing/(success|cancel)$ { try_files /index.html =404; }

    # Always revalidate app code so deploys take effect immediately.
    location ~ \.(js|html)$ { add_header Cache-Control "no-cache" always; add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' ws: wss:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "no-referrer" always; }

    # `$uri/` lets `/` (and any directory) fall through to its index.html.
    location / { try_files $uri $uri/ $uri.html =404; }
}
