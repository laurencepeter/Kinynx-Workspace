<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Kinynx</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #ffffff; --text: #1d1f27; --muted: #6b7083; --border: #e2e4ec; --accent: #6d5efc; --code: #f4f5f8; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0e0f13; --text: #e7e9f0; --muted: #9aa0b4; --border: #2a2e3f; --code: #171922; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 48px 16px 80px; }
      h1 { font-size: 34px; line-height: 1.2; margin: 0 0 24px; letter-spacing: -.01em; }
      .k-body h1 { font-size: 26px; } .k-body h2 { font-size: 21px; } .k-body h3 { font-size: 17px; }
      .k-body p { margin: 6px 0; } hr { border: 0; border-top: 1px solid var(--border); margin: 22px 0; }
      blockquote { margin: 8px 0; border-left: 3px solid var(--accent); padding: 2px 14px; color: var(--muted); }
      pre { background: var(--code); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow: auto; font: 13px/1.5 ui-monospace, Menlo, monospace; }
      .k-check { display: flex; gap: 10px; margin: 4px 0; } .k-check.done span { text-decoration: line-through; color: var(--muted); }
      .k-check input { width: 17px; height: 17px; margin-top: 4px; accent-color: var(--accent); }
      img { max-width: 100%; border-radius: 8px; } a { color: var(--accent); }
      footer { margin-top: 48px; font-size: 12px; color: var(--muted); }
      form { display: flex; gap: 8px; max-width: 380px; }
      input[type=password] { flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
      button { padding: 9px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Loading…</h1>
      <form id="pwForm" hidden>
        <input type="password" id="pw" placeholder="Page password" autocomplete="current-password" aria-label="Page password" />
        <button>Open</button>
      </form>
      <article class="k-body" id="body"></article>
      <footer>Published with <a href="/">Kinynx</a></footer>
    </main>
    <script src="/render.js"></script>
    <script src="/p.js"></script>
  </body>
</html>
