<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinynx</title>
    <style>
      :root {
        --bg: #0e0f13; --panel: #171922; --panel-2: #1e2130; --border: #2a2e3f;
        --text: #e7e9f0; --muted: #9aa0b4; --accent: #6d5efc; --accent-2: #22d3ee;
        --ok: #34d399; --danger: #f87171; --radius: 12px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 80% -10%, #1b1e34, var(--bg)); color: var(--text);
        min-height: 100vh;
      }
      header {
        display: flex; align-items: center; gap: 12px; padding: 14px 22px;
        border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(14,15,19,.8);
        backdrop-filter: blur(8px); z-index: 5;
      }
      .logo { font-weight: 800; letter-spacing: .5px; font-size: 18px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text;
        background-clip: text; color: transparent; }
      .badge { font-size: 11px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px;
        color: var(--muted); }
      .spacer { flex: 1; }
      main { max-width: 1080px; margin: 0 auto; padding: 26px 22px; }
      .grid { display: grid; grid-template-columns: 300px 1fr; gap: 22px; }
      @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 18px; }
      h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 12px; }
      input, button, select {
        font: inherit; border-radius: 9px; border: 1px solid var(--border); background: var(--panel-2);
        color: var(--text); padding: 10px 12px; width: 100%;
      }
      input:focus { outline: 2px solid var(--accent); border-color: transparent; }
      button { cursor: pointer; background: linear-gradient(90deg, var(--accent), #8b7dff); border: none;
        font-weight: 600; transition: transform .08s ease, filter .2s ease; }
      button:hover { filter: brightness(1.08); } button:active { transform: translateY(1px); }
      button.ghost { background: var(--panel-2); border: 1px solid var(--border); font-weight: 500; }
      .row { display: flex; gap: 8px; }
      .stack > * + * { margin-top: 10px; }
      .list { display: flex; flex-direction: column; gap: 6px; }
      .item { padding: 9px 11px; border-radius: 9px; border: 1px solid transparent; cursor: pointer;
        display: flex; gap: 8px; align-items: center; }
      .item:hover { background: var(--panel-2); } .item.active { background: var(--panel-2); border-color: var(--accent); }
      .muted { color: var(--muted); } .small { font-size: 12px; }
      .tree-child { margin-left: 16px; }
      .block { border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; margin-top: 8px;
        display: flex; gap: 10px; align-items: baseline; }
      .btype { font-size: 10px; text-transform: uppercase; color: var(--accent-2); min-width: 64px; }
      .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
        background: var(--panel-2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px;
        opacity: 0; transition: opacity .2s; }
      .toast.show { opacity: 1; }
      .hidden { display: none; }
      .feat { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); }
      .chip.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
      .chip.off { color: var(--muted); opacity: .6; }
    </style>
  </head>
  <body>
    <header>
      <span class="logo">◆ Kinynx</span>
      <span class="badge" id="edition">Community</span>
      <span class="spacer"></span>
      <span class="small" id="presence"></span>
      <span class="small muted" id="whoami"></span>
      <button class="ghost" style="width:auto" id="logout">Sign out</button>
    </header>

    <main>
      <!-- Auth -->
      <section id="auth" class="card" style="max-width:420px;margin:8vh auto;">
        <h2 id="authTitle">Sign in</h2>
        <div class="stack">
          <input id="email" placeholder="you@company.com" autocomplete="email" />
          <input id="password" type="password" placeholder="Password (min 8 chars)" autocomplete="current-password" />
          <div class="row">
            <button id="loginBtn">Sign in</button>
            <button class="ghost" id="registerBtn">Create account</button>
          </div>
          <p class="small muted" id="ssoHint"></p>
        </div>
      </section>

      <!-- App -->
      <section id="app" class="hidden">
        <div class="grid">
          <div class="stack">
            <div class="card">
              <h2>Organizations</h2>
              <div class="list" id="orgs"></div>
              <div class="row" style="margin-top:10px">
                <input id="newOrg" placeholder="New organization" />
                <button style="width:auto" id="addOrg">+</button>
              </div>
            </div>
            <div class="card">
              <h2>Workspaces</h2>
              <div class="list" id="workspaces"></div>
              <div class="row" style="margin-top:10px">
                <input id="newWs" placeholder="New workspace" />
                <button style="width:auto" id="addWs">+</button>
              </div>
              <button class="ghost" id="invite" style="margin-top:8px">🔗 Copy invite link</button>
            </div>
            <div class="card">
              <h2>Pages</h2>
              <div class="list" id="pages"></div>
              <div class="row" style="margin-top:10px">
                <input id="newPage" placeholder="New page" />
                <button style="width:auto" id="addPage">+</button>
              </div>
            </div>
          </div>

          <div class="stack">
            <div class="card">
              <input id="pageTitle" placeholder="Untitled" style="font-size:22px;font-weight:700;border:none;background:transparent;padding:4px 0" />
              <p class="small muted" id="pageMeta">Select or create a page to start editing.</p>
              <div id="blocks"></div>
              <div class="row" style="margin-top:14px">
                <select id="blockType" style="width:160px">
                  <option value="heading">Heading</option>
                  <option value="paragraph">Paragraph</option>
                  <option value="checklist">Checklist</option>
                  <option value="code">Code</option>
                  <option value="quote">Quote</option>
                  <option value="divider">Divider</option>
                </select>
                <input id="blockText" placeholder="Block content…" />
                <button style="width:auto" id="addBlock">Add block</button>
              </div>
            </div>
            <div class="card">
              <h2>Edition &amp; entitlements</h2>
              <div class="feat" id="features"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="toast" id="toast"></div>
    <script src="./app.js"></script>
  </body>
</html>
