<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinynx</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e0f13" />
    <style>
      :root {
        --bg: #0e0f13; --panel: #171922; --panel-2: #1e2130; --border: #2a2e3f;
        --text: #e7e9f0; --muted: #9aa0b4; --accent: #6d5efc; --accent-2: #22d3ee;
        --ok: #34d399; --danger: #f87171; --radius: 12px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(1200px 600px at 80% -10%, #1b1e34, var(--bg)); color: var(--text);
        min-height: 100vh;
      }
      header {
        display: flex; align-items: center; gap: 10px; padding: 12px 22px;
        border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(14,15,19,.82);
        backdrop-filter: blur(8px); z-index: 5;
      }
      .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -.01em; font-size: 18px; }
      .spacer { flex: 1; }
      main { max-width: 1240px; margin: 0 auto; padding: 22px; }
      .grid { display: grid; grid-template-columns: 290px 1fr; gap: 22px; align-items: start; }
      .grid > * { min-width: 0; }
      @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
      h2.section { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0; }
      .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      input, button, select, textarea {
        font: inherit; border-radius: 9px; border: 1px solid var(--border); background: var(--panel-2);
        color: var(--text); padding: 9px 12px;
      }
      input, select, textarea { width: 100%; }
      input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
      button { cursor: pointer; background: linear-gradient(90deg, var(--accent), #8b7dff); border: none;
        font-weight: 600; transition: transform .08s ease, filter .2s ease; white-space: nowrap; }
      button:hover { filter: brightness(1.1); } button:active { transform: translateY(1px); }
      button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
      button.ghost { background: var(--panel-2); border: 1px solid var(--border); font-weight: 500; }
      button.icon { background: transparent; border: none; padding: 3px 6px; color: var(--muted); font-weight: 500; }
      button.icon:hover { color: var(--text); background: var(--panel-2); }
      button.danger { background: var(--danger); color: #1a0b0b; }
      button.pro { background: linear-gradient(90deg, #f59e0b, #ec4899); color: #fff; padding: 7px 12px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .stack > * + * { margin-top: 14px; }
      .list { display: flex; flex-direction: column; gap: 2px; }
      .item { padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; cursor: pointer;
        display: flex; gap: 8px; align-items: center; min-height: 34px; }
      .item:hover { background: var(--panel-2); } .item.active { background: var(--panel-2); border-color: var(--accent); }
      .item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item .actions { display: none; gap: 0; } .item:hover .actions, .item:focus-within .actions { display: flex; }
      .muted { color: var(--muted); } .small { font-size: 12px; }
      .hidden { display: none !important; }
      .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 50;
        background: var(--panel-2); border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px;
        opacity: 0; transition: opacity .2s; pointer-events: none; }
      .toast.show { opacity: 1; }
      .chip { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); display: inline-flex; gap: 5px; align-items: center; }
      .chip.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
      .chip.off { color: var(--muted); opacity: .65; }
      .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
      .avatar { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center;
        font-size: 11px; font-weight: 700; color: #0e0f13; margin-left: -6px; border: 2px solid var(--bg); }

      /* Editor */
      .page-head { display: flex; gap: 10px; align-items: center; }
      .page-icon { font-size: 30px; background: transparent; border: none; padding: 0 4px; }
      #pageTitle { font-size: 28px; font-weight: 750; border: none; background: transparent; padding: 4px 0; letter-spacing: -.01em; }
      #pageTitle:focus { outline: none; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
      .toolbar button { padding: 6px 10px; font-size: 13px; }
      .contributors { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
      #blocks { min-height: 40px; }
      .blk { position: relative; display: flex; gap: 6px; align-items: flex-start; padding: 2px 6px 2px 10px;
        border-left: 3px solid transparent; border-radius: 6px; }
      .show-authors .blk { border-left-color: var(--author, transparent); }
      .blk:hover { background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
      .blk .tools { visibility: hidden; display: flex; gap: 0; flex: none; padding-top: 4px; }
      .blk:hover .tools, .blk:focus-within .tools { visibility: visible; }
      .blk .body { flex: 1; min-width: 0; padding: 4px 0; }
      .ed { outline: none; white-space: pre-wrap; word-break: break-word; min-height: 1.5em; }
      .ed:empty::before { content: attr(data-ph); color: var(--muted); opacity: .6; }
      /* Tiptap (ProseMirror) text blocks */
      .ed-host { display: block; margin: 0; }
      .ed.ProseMirror p { margin: 0; }
      .ed.ProseMirror p.is-editor-empty:first-child::before { content: attr(data-placeholder); color: var(--muted); opacity: .6;
        float: left; height: 0; pointer-events: none; }
      .ed.ProseMirror a { color: var(--accent-2); }
      .ed.ProseMirror code { font: 0.9em ui-monospace, Menlo, monospace; background: var(--panel-2); padding: 1px 4px; border-radius: 4px; }
      .blk h1, .blk h2, .blk h3 { margin: 8px 0 2px; line-height: 1.25; }
      .blk h1 { font-size: 26px; } .blk h2 { font-size: 21px; } .blk h3 { font-size: 17px; }
      .blk p { margin: 0; }
      .blk hr, .k-body hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; width: 100%; }
      .blk blockquote, .k-body blockquote { margin: 0; border-left: 3px solid var(--accent); padding: 2px 12px; color: #c9cce0; }
      .blk pre, .k-code { margin: 0; background: #0b0c10; border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 12px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: auto; }
      .check { display: flex; gap: 10px; align-items: flex-start; }
      .check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; cursor: pointer; }
      .check.done .ed { text-decoration: line-through; color: var(--muted); }
      .blk img { max-width: 100%; border-radius: 8px; }
      .author-tag { font-size: 10px; color: var(--muted); padding-top: 7px; flex: none; display: none; }
      .show-authors .blk:hover .author-tag { display: block; }
      .composer { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
      .composer select { width: 150px; flex: none; }
      .empty { text-align: center; padding: 50px 10px; color: var(--muted); }

      dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 14px;
        padding: 20px; width: min(520px, 92vw); }
      dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
      dialog h3 { margin: 0 0 12px; }
      .menu { position: absolute; z-index: 20; background: var(--panel); border: 1px solid var(--border);
        border-radius: 10px; padding: 4px; min-width: 190px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
      .menu button { display: block; width: 100%; text-align: left; background: transparent; font-weight: 500; padding: 8px 10px; }
      .menu button:hover { background: var(--panel-2); }
      .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      dialog.wide { width: min(860px, 96vw); }

      /* Formatting toolbar */
      .fmt { position: sticky; top: 58px; z-index: 4; background: color-mix(in srgb, var(--panel) 94%, transparent);
        backdrop-filter: blur(6px); border: 1px solid var(--border); border-radius: 10px; padding: 6px; margin: 0 0 12px; }
      .fmt-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .fmt-tools { display: flex; flex-wrap: wrap; gap: 4px 10px; }
      .fmt-group { display: flex; flex-wrap: wrap; gap: 2px; padding-right: 10px; border-right: 1px solid var(--border); }
      .fmt-group:last-child { border-right: 0; }
      .fmt-btn { background: transparent; border: 1px solid transparent; color: var(--text); font-weight: 600; padding: 4px 8px;
        min-width: 32px; height: 32px; font-size: 14px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; }
      .fmt-btn:hover { background: var(--panel-2); filter: none; }
      .fmt-btn[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 28%, transparent); border-color: var(--accent); }
      .fmt-color .bar { width: 16px; height: 3px; border-radius: 2px; margin-top: 1px; }
      .fmt-select { width: auto; padding: 4px 6px; height: 32px; font-size: 13px; }
      .fmt-all { padding: 5px 10px; font-size: 13px; }
      .seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
      .seg button { background: transparent; font-weight: 500; padding: 4px 10px; font-size: 12px; border-radius: 7px; color: var(--muted); }
      .seg button[aria-checked="true"] { background: var(--accent); color: #fff; }
      .swatch-menu { padding: 8px; width: 196px; }
      .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 8px; }
      .menu .sw, .sw { width: 26px; height: 26px; padding: 0; border-radius: 6px; border: 1px solid var(--border); display: block; }
      .catalog section + section { margin-top: 14px; }
      .catalog h4 { margin: 0 0 6px; }
      .cat-table { width: 100%; border-collapse: collapse; }
      .cat-table td { padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: top; }
      .cat-ic { width: 36px; text-align: center; }
      kbd { font: 12px ui-monospace, Menlo, monospace; background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }
      .inkpad-wrap { border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
      .inkpad { display: block; width: 100%; height: auto; background: #fff; color: #1d1f27; touch-action: none; cursor: crosshair; border-radius: 8px; }

      /* Drag & drop */
      .blk .handle { cursor: grab; touch-action: none; user-select: none; }
      .is-dragging, .is-dragging * { cursor: grabbing !important; user-select: none; }
      .blk.dragging { opacity: .4; }
      .drop-line { position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: var(--accent-2);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-2) 25%, transparent); pointer-events: none; }
      #blocks { position: relative; }
      @media (max-width: 860px) {
        .fmt { position: static; }
        .fmt-tools { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
        .fmt-group { flex-wrap: nowrap; flex: none; }
      }
      @media (max-width: 600px) {
        #whoami { display: none; }
        header { padding: 10px 16px; } main { padding: 16px; }
        .k-table-wrap { max-width: calc(100vw - 90px); }
      }
      .k-table .ed.cell { min-height: 1.5em; outline: none; }
      .k-table td:focus-within, .k-table th:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
      .k-table td, .k-table th { border-color: var(--border); }
      .blk .k-callout { background: color-mix(in srgb, var(--accent) 14%, transparent); }
      .tpl { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
    </style>
  </head>
  <body>
    <header>
      <span class="logo"><img src="/icon.svg" alt="" width="22" height="22" />Kinynx</span>
      <span class="spacer"></span>
      <span id="presence" class="row" style="gap:0;padding-left:6px" aria-label="People here"></span>
      <button class="pro hidden" id="planBtn" title="Plan & features">✦ <span id="planLabel">Pro</span></button>
      <button class="ghost hidden" style="position:relative" id="bell" aria-label="Notifications">🔔<span id="notifCount" class="chip" style="display:none;position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;padding:1px 6px">0</span></button>
      <span class="small muted" id="whoami"></span>
      <button class="ghost hidden" id="logout">Sign out</button>
    </header>

    <main>
      <!-- Auth -->
      <section id="auth" class="card" style="max-width:420px;margin:8vh auto;">
        <h2 class="section" style="margin-bottom:12px">Sign in</h2>
        <p class="small hidden" id="authNote" style="margin:0 0 12px;color:var(--accent-2)"></p>
        <form class="stack" id="authForm">
          <input id="email" type="email" placeholder="you@company.com" autocomplete="email" required />
          <input id="password" type="password" placeholder="Password (min 8 chars)" autocomplete="current-password" minlength="8" required />
          <div class="row">
            <button id="loginBtn" type="submit" style="flex:1">Sign in</button>
            <button class="ghost" id="registerBtn" type="button" style="flex:1">Create account</button>
          </div>
          <button class="icon small" id="forgotBtn" type="button">Forgot password?</button>
        </form>
      </section>

      <!-- App -->
      <section id="app" class="hidden">
        <div class="grid">
          <aside class="card stack">
            <div>
              <div class="section-head">
                <h2 class="section">Organization</h2>
                <span class="row" style="gap:0">
                  <button class="icon" id="orgRename" title="Rename organization">✎</button>
                  <button class="icon" id="orgDelete" title="Delete organization">🗑</button>
                  <button class="icon" id="orgNew" title="New organization">＋</button>
                </span>
              </div>
              <select id="orgSelect" aria-label="Organization"></select>
            </div>
            <div>
              <div class="section-head">
                <h2 class="section">Workspaces</h2>
                <span class="row" style="gap:0">
                  <button class="icon" id="invite" title="Copy invite link (editor)">🔗</button>
                  <button class="icon" id="wsNew" title="New workspace">＋</button>
                </span>
              </div>
              <div class="list" id="workspaces"></div>
            </div>
            <div>
              <div class="section-head">
                <h2 class="section">Pages</h2>
                <span class="row" style="gap:0">
                  <button class="icon" id="templatesBtn" title="Templates & import">⬇︎</button>
                  <button class="icon" id="pageNew" title="New page">＋</button>
                </span>
              </div>
              <div class="list" id="pages"></div>
            </div>
          </aside>

          <div class="stack">
            <div class="card" id="editorCard">
              <div id="noPage" class="empty">Select or create a page to start editing.</div>
              <div id="editor" class="hidden">
                <div class="page-head">
                  <button class="page-icon" id="pageIcon" title="Change icon">📄</button>
                  <input id="pageTitle" placeholder="Untitled" aria-label="Page title" maxlength="400" />
                </div>
                <p class="small muted" id="pageMeta" style="margin:2px 0 0"></p>
                <div class="toolbar">
                  <button class="ghost" id="publishBtn">🌐 Publish</button>
                  <button class="ghost" id="exportBtn">⤓ Export</button>
                  <button class="ghost" id="saveTplBtn">⧉ Save as template</button>
                  <button class="ghost" id="authorsBtn" aria-pressed="true">🎨 Authors</button>
                </div>
                <div class="fmt" id="fmtBar" aria-label="Formatting tools"></div>
                <div class="contributors" id="contributors"></div>
                <div id="blocks" class="show-authors"></div>
                <form class="composer" id="composer">
                  <select id="blockType" aria-label="Block type">
                    <option value="paragraph">¶ Text</option>
                    <option value="heading">H Heading</option>
                    <option value="checklist">☑ Checklist</option>
                    <option value="bulleted_list">• Bulleted list</option>
                    <option value="numbered_list">1. Numbered list</option>
                    <option value="table">▦ Table</option>
                    <option value="callout">💡 Callout</option>
                    <option value="signature">✍ Signature</option>
                    <option value="drawing">✏️ Drawing</option>
                    <option value="quote">❝ Quote</option>
                    <option value="code">&lt;/&gt; Code</option>
                    <option value="divider">― Divider</option>
                    <option value="image">🖼 Image (URL)</option>
                    <option value="embed">🔗 Link</option>
                  </select>
                  <input id="blockText" placeholder="Type and press Enter…  (/h /ul /ol /todo /table /sign /quote /code /hr)" autocomplete="off" />
                  <button type="submit">Add</button>
                </form>
              </div>
            </div>
            <div class="card hidden" id="commentsCard">
              <h2 class="section" style="margin-bottom:10px">Comments</h2>
              <div class="list" id="comments"></div>
              <form class="row" style="margin-top:10px" id="commentForm">
                <input id="commentText" placeholder="Add a comment…" maxlength="5000" />
                <button type="submit">Send</button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="notifPanel" class="card hidden" style="position:fixed;top:60px;right:22px;width:320px;max-height:60vh;overflow:auto;z-index:10">
      <div class="row" style="justify-content:space-between"><h2 class="section">Notifications</h2><button class="ghost" style="padding:4px 8px" id="markAll">Mark all read</button></div>
      <div class="list" id="notifList" style="margin-top:8px"></div>
    </div>
    <dialog id="dlg"></dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/vendor/kinynx-tiptap.js"></script>
    <script src="/render.js"></script>
    <script src="/app.js"></script>
    <script src="/editor.js"></script>
  </body>
</html>
