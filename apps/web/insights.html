<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinynx Insights</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e0f13" />
    <style>
      :root {
        --bg:#0e0f13; --panel:#171922; --panel-2:#1e2130; --border:#2a2e3f; --grid:#232737;
        --text:#e7e9f0; --muted:#9aa0b4; --accent:#6d5efc; --accent-2:#22d3ee; --radius:12px;
        --good:#199e70; --warn:#c98500; --bad:#e66767; --gap:14px; --pad:16px;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg:#f6f6f4; --panel:#ffffff; --panel-2:#f0f0ec; --border:#e0dfda; --grid:#ecebe6;
        --text:#141413; --muted:#5d5c57; color-scheme: light;
      }
      :root[data-density="compact"] { --gap:8px; --pad:10px; }
      *{box-sizing:border-box}
      body{margin:0;font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
      header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
      .logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--text);text-decoration:none}
      nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px}
      nav a:hover,nav a.on{color:var(--text);background:var(--panel-2)}
      .spacer{flex:1}
      main{max-width:1280px;margin:0 auto;padding:20px 16px}
      select,input,button,textarea{font:inherit;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:8px 11px}
      button{cursor:pointer;background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
      button.ghost{background:var(--panel-2);border:1px solid var(--border);color:var(--text);font-weight:500}
      button.icon{padding:4px 8px;background:transparent;border:none;color:var(--muted)}
      button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
      .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
      .stack>*+*{margin-top:10px}
      .muted{color:var(--muted)} .small{font-size:13px} .hidden{display:none!important}
      .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
      .tabs button{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);font-weight:500;padding:10px 14px}
      .tabs button[aria-selected="true"]{color:var(--text);border-color:var(--accent)}
      .layout{display:grid;grid-template-columns:230px 1fr;gap:18px}
      @media (max-width:820px){.layout{grid-template-columns:1fr}}
      .side{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px;align-self:start}
      .side .item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted)}
      .side .item.on,.side .item:hover{background:var(--panel-2);color:var(--text)}
      .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
      @media (max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
      @media (max-width:620px){.grid{grid-template-columns:1fr}.grid>.card{grid-column:span 1!important}}
      .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:var(--pad);min-width:0}
      .card h3{margin:0;font-size:14px;font-weight:600}
      .card .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
      .card .sub{font-size:12px;color:var(--muted)}
      .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
      .tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:var(--pad)}
      .tile .l{font-size:12px;color:var(--muted)} .tile .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .tile.hero{grid-column:span 2}.tile.hero .v{font-size:48px;line-height:1.1}
      .tile .v{font-size:22px}
      .empty-state{text-align:center;padding:48px 16px;border:1px dashed var(--border);border-radius:var(--radius)}
      table.data{width:100%;border-collapse:collapse;font-size:14px}
      table.data th,table.data td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:middle}
      table.data td input,table.data td select{width:100%;padding:5px 7px;font-size:13px;background:transparent;border-color:transparent}
      table.data td input:hover,table.data td input:focus,table.data td select:hover{border-color:var(--border);background:var(--panel-2)}
      .scroll{overflow-x:auto}
      .stage{display:grid;grid-template-columns:28px 1fr 46px 120px 90px 34px;gap:8px;align-items:center;margin-bottom:8px}
      .stage input[type=color]{padding:2px;height:36px}
      .matrix td,.matrix th{padding:4px 8px;text-align:center;font-size:13px}
      .matrix th:first-child,.matrix td:first-child{text-align:left}
      .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--border)}
      .feed li{padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;list-style:none}
      .feed{padding:0;margin:0;max-height:420px;overflow:auto}
      dialog{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:20px;width:min(560px,calc(100vw - 32px))}
      dialog::backdrop{background:rgba(0,0,0,.55)}
      .f>label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
      .f{margin-bottom:12px} dialog .f>select,dialog .f>input{width:100%}
      .stage input,.stage select{width:100%;min-width:0}
      .filters .row{margin-bottom:6px}
      #auth{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
      #auth input{width:100%}
      #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--border);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
      #toast.show{opacity:1}
      /* charts */
      .kx-axis{stroke:var(--border);stroke-width:1}.kx-grid{stroke:var(--grid);stroke-width:1}
      .kx-cross{stroke:var(--muted);stroke-width:1}
      .kx-lbl,.kx-val{font-size:12px;fill:var(--muted)}
      .kx-dot{stroke:var(--panel);stroke-width:2}
      .kx-mark{cursor:default}.kx-mark:hover{opacity:.85}
      .kx-hero-s{font-size:26px;font-weight:600;fill:var(--text)}
      .kx-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
      .kx-legend-v{flex-direction:column;gap:6px;flex:1;min-width:120px}
      .kx-legend-v .kx-li b{margin-left:auto;color:var(--text);font-weight:600}
      .kx-li{display:flex;align-items:center;gap:6px}
      .kx-sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
      .kx-donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
      .kx-number .kx-hero{font-size:48px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
      .kx-sub{font-size:12px;color:var(--muted)}
      .kx-empty{color:var(--muted);font-size:13px;padding:28px 0;text-align:center}
      .kx-table{width:100%;border-collapse:collapse;font-size:13px}
      .kx-table th,.kx-table td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:left}
      .kx-table .num{text-align:right;font-variant-numeric:tabular-nums}
      .kx-tip{position:fixed;display:none;z-index:60;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
      .kx-tip-t{font-weight:600;margin-bottom:4px}.kx-tip-r{display:flex;align-items:center;gap:6px}.kx-tip-r b{margin-left:auto;padding-left:12px}
      .kx-meter{height:8px;border-radius:99px;background:color-mix(in srgb,var(--accent) 22%,transparent);overflow:hidden}
      .kx-fill{height:100%;background:var(--accent);border-radius:99px}.kx-fill.over{background:var(--bad)}
    </style>
  </head>
  <body>
    <header>
      <a class="logo" href="./index.html"><img src="/icon.svg" alt="" width="22" height="22" />Kinynx</a>
      <nav class="row" id="nav">
        <a href="./index.html" data-nav="docs">Docs</a>
        <a href="./board.html" data-nav="board">Board</a>
        <a href="./insights.html" class="on" data-nav="insights" aria-current="page">Insights</a>
      </nav>
      <span class="spacer"></span>
      <select id="workspace" aria-label="Workspace" class="hidden"></select>
      <button class="ghost hidden" id="customizeBtn" title="Customize workspace">⚙ Customize</button>
    </header>
    <main>
      <section id="auth" class="stack hidden">
        <h3>Sign in</h3>
        <input id="email" placeholder="you@company.com" autocomplete="username" />
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
        <button id="loginBtn">Sign in</button>
        <p class="muted small">Uses the same account as the docs app.</p>
      </section>

      <section id="app" class="hidden">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="dashboards" aria-selected="true">Dashboards</button>
          <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
          <button role="tab" data-tab="workflow" aria-selected="false">Workflow</button>
          <button role="tab" data-tab="data" aria-selected="false">Data</button>
        </div>

        <div id="tab-dashboards" class="layout">
          <aside class="side">
            <div id="dashList"></div>
            <button class="ghost" id="newDash" style="width:100%;margin-top:8px">+ Dashboard</button>
            <button class="ghost" id="starter" style="width:100%;margin-top:8px" title="Creates a tracker database, workflow and dashboard">✦ Project tracker starter</button>
          </aside>
          <div>
            <div class="row" style="margin-bottom:14px">
              <div>
                <h2 id="dashTitle" style="margin:0;font-size:20px"></h2>
                <div id="dashDesc" class="muted small"></div>
              </div>
              <span class="spacer"></span>
              <button class="ghost" id="addWidget">+ Widget</button>
              <select id="reportFmt" aria-label="Report format"><option value="html">Report · HTML</option><option value="md">Report · Markdown</option><option value="csv">Report · CSV</option></select>
              <button class="ghost" id="reportBtn">⇩ Generate report</button>
              <button class="icon" id="dashMenu" aria-label="Dashboard options">⋯</button>
            </div>
            <div id="dashGrid" class="grid"></div>
          </div>
        </div>

        <div id="tab-progress" class="hidden">
          <div class="row" style="margin-bottom:14px">
            <select id="progDb" aria-label="Database"></select>
            <select id="progDays" aria-label="Window"><option value="14">Last 14 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select>
          </div>
          <div id="progBody"></div>
        </div>

        <div id="tab-workflow" class="hidden">
          <div class="row" style="margin-bottom:14px">
            <select id="wfDb" aria-label="Database"></select>
            <span class="muted small">Stages, allowed moves and WIP limits are enforced by the server for everyone.</span>
          </div>
          <div id="wfBody"></div>
        </div>

        <div id="tab-data" class="hidden">
          <div class="row" style="margin-bottom:14px">
            <select id="dataDb" aria-label="Database"></select>
            <button class="ghost" id="newDb">+ Database</button>
            <button class="ghost" id="addProp">+ Property</button>
            <span class="spacer"></span>
            <button class="ghost" id="exportCsv">⇩ CSV</button>
          </div>
          <div class="grid">
            <div class="card scroll" style="grid-column:span 3"><div id="dataTable"></div></div>
            <div class="card"><div class="head"><h3>Activity</h3></div><ul class="feed" id="feed"></ul></div>
          </div>
        </div>
      </section>
    </main>
    <dialog id="dlg"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="./charts.js"></script>
    <script src="./insights.js"></script>
  </body>
</html>
