# ════════════════════════════════════════════════════════════════════════════
# Kinynx — single-command self-hosting.  `docker compose up -d`  →  http://localhost
# Works fully offline / air-gapped after images are pulled.
# ════════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinynx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-kinynx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinynx}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Optional object storage. OFF by default — the API uses the built-in
  # `local` filesystem driver (persisted in the `uploads` volume) so the
  # default stack has no external image dependency.
  #
  # MinIO's images were removed from Docker Hub in 2026 (and anonymous
  # quay.io pulls were later restricted), so this is pinned to quay.io and
  # gated behind a profile. Enable with:  docker compose --profile minio up -d
  # and set  STORAGE_DRIVER=s3  (plus S3_* below). If quay.io refuses an
  # anonymous pull in your region, use external S3/R2 or your own mirror.
  minio:
    image: quay.io/minio/minio:latest
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kinynx}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-in-production}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 4000
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      DATABASE_URL: postgres://${POSTGRES_USER:-kinynx}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-kinynx}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      # Default: local filesystem storage (persisted in the `uploads` volume).
      # For S3/MinIO set STORAGE_DRIVER=s3 and the S3_* vars; enable the minio
      # profile or point S3_ENDPOINT at external S3/R2.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-kinynx}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kinynx}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-in-production}
      S3_FORCE_PATH_STYLE: "true"
      KINYNX_LICENSE_FILE: ${KINYNX_LICENSE_FILE:-}
      KINYNX_LICENSE_PUBLIC_KEY: ${KINYNX_LICENSE_PUBLIC_KEY:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-Kinynx <no-reply@kinynx.local>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kinynx}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-kinynx}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Static client (docs/board/admin) baked into the image — no host bind
  # mount, so it is portable to Coolify and other git-deploy platforms.
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped

  # Reverse proxy with the Caddyfile baked in (see caddy.Dockerfile).
  caddy:
    build:
      context: .
      dockerfile: infrastructure/docker/caddy.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  miniodata:
  caddydata:
  caddyconfig:
