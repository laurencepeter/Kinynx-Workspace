# ════════════════════════════════════════════════════════════════════════════
# Kinynx — single-command self-hosting.  `docker compose up -d`  →  http://localhost
# Works fully offline / air-gapped after images are pulled.
# ════════════════════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kinynx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-kinynx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinynx}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Object storage: the default is the built-in `local` filesystem driver
  # (persisted in the `uploads` volume), so this file pulls no MinIO image.
  # MinIO lives in docker-compose.minio.yml because quay.io/Docker Hub now
  # refuse anonymous pulls, and platforms such as Coolify pull every service
  # in this file, ignoring `profiles`.

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 4000
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      DATABASE_URL: postgres://${POSTGRES_USER:-kinynx}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-kinynx}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      # Default: local filesystem storage (persisted in the `uploads` volume).
      # For S3/MinIO set STORAGE_DRIVER=s3 and the S3_* vars; add
      # docker-compose.minio.yml or point S3_ENDPOINT at external S3/R2.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /data/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-kinynx}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kinynx}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-in-production}
      S3_FORCE_PATH_STYLE: "true"
      KINYNX_LICENSE_FILE: ${KINYNX_LICENSE_FILE:-}
      KINYNX_LICENSE_PUBLIC_KEY: ${KINYNX_LICENSE_PUBLIC_KEY:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-Kinynx <no-reply@kinynx.local>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["node", "dist/worker.js"]
    # Override the API image's HTTP healthcheck (the worker serves no port):
    # healthy while a maintenance tick has succeeded within ~2 intervals.
    healthcheck:
      test: ["CMD", "node", "-e", "const t=+require('fs').readFileSync('/tmp/kinynx-worker.heartbeat','utf8');process.exit(Date.now()-t<2*(+process.env.WORKER_INTERVAL_MS||900000)+60000?0:1)"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kinynx}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-kinynx}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Static client (docs/board/admin) baked into the image — no host bind
  # mount, so it is portable to Coolify and other git-deploy platforms.
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped

  # Reverse proxy with the Caddyfile baked in (see caddy.Dockerfile).
  #
  # Host ports are NOT published here: on a managed platform (Coolify, etc.)
  # the platform's own ingress proxy owns host 80/443 and routes to this
  # container over the shared network, so publishing them ourselves collides
  # ("port is already allocated"). For plain `docker compose up` self-hosting,
  # docker-compose.override.yml publishes 80/443 so http://localhost works.
  caddy:
    build:
      context: .
      dockerfile: infrastructure/docker/caddy.Dockerfile
    expose:
      - "80"
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
  caddyconfig:
