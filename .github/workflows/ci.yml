name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinynx
          POSTGRES_PASSWORD: kinynx
          POSTGRES_DB: kinynx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kinynx"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgres://kinynx:kinynx@localhost:5432/kinynx_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-at-least-16-chars-long

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Build (packages, enterprise, services)
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Migrate (so enterprise DB tests have the schema)
        run: pnpm --filter @kinynx/api run migrate

      - name: Test
        run: pnpm -r run test
